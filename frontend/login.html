<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Hub - Choose login</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<style>.pick{min-height:100vh;display:grid;place-items:center;padding:24px}.pick .w{max-width:880px;width:100%}.pick h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.opt{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;color:var(--ink);text-decoration:none}
.opt:hover{border-color:var(--accent);text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.06)}.opt b{font-size:18px;display:block;margin-bottom:6px}.opt span{color:var(--muted)}
@media (max-width:760px){.opts{grid-template-columns:1fr}}</style>
</head>
<body>
  <div class="pick"><div class="w">
    <div class="logo" style="color:var(--side)">Customer<span> Hub</span></div>
    <h1>Who is signing in?</h1><p class="lead" style="margin:0">Choose your login.</p>
    <div class="opts">
      <a class="opt" href="customer-login.html"><b>Customer</b><span>Shop, track orders, returns and support.</span></a>
      <a class="opt" href="sales-login.html"><b>Sales person</b><span>Manage your customers, orders and cases.</span></a>
      <a class="opt" href="admin-login.html"><b>Admin</b><span>Manage the team, products and everything else.</span></a>
    </div>
  </div></div>
</body>
</html>
